<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LatteWrite — Web</title>
    <meta name="theme-color" content="#17100a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LatteWrite" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="row main">
          <div class="group">
            <button id="btn-open" class="solid">OPEN</button>
            <button id="btn-new" class="solid">NEW</button>
            <button id="btn-save" class="solid accent">SAVE</button>
          </div>
          <div class="filename" id="filename">No file open</div>
          <div class="group right">
            <button id="btn-zoom-out" title="Smaller">A-</button>
            <button id="btn-zoom-in" title="Bigger">A+</button>
            <div class="menuwrap">
              <button id="btn-theme" title="Theme">THEME</button>
              <div class="thememenu" id="theme-menu" hidden></div>
            </div>
          </div>
        </div>

        <div class="row tools" id="toolbar">
          <div class="group">
            <button data-cmd="undo" title="Undo">UNDO</button>
            <button data-cmd="redo" title="Redo">REDO</button>
          </div>
          <div class="group">
            <button data-cmd="p" title="Body text">¶</button>
            <button data-cmd="h1">H1</button>
            <button data-cmd="h2">H2</button>
            <button data-cmd="h3">H3</button>
          </div>
          <div class="group">
            <button data-cmd="bold" class="ff-b" title="Bold">B</button>
            <button data-cmd="italic" class="ff-i" title="Italic">I</button>
            <button data-cmd="underline" class="ff-u" title="Underline">U</button>
            <button data-cmd="strike" class="ff-s" title="Strikethrough">S</button>
          </div>
          <div class="group">
            <button data-cmd="bullet">UL</button>
            <button data-cmd="ordered">OL</button>
            <button data-cmd="quote">QUOTE</button>
            <button data-cmd="code">CODE</button>
            <button data-cmd="rule">RULE</button>
          </div>
          <div class="group">
            <button data-cmd="left">LEFT</button>
            <button data-cmd="center">CENTER</button>
            <button data-cmd="right">RIGHT</button>
          </div>
          <div class="group tablewrap">
            <button id="btn-table" title="Table">TABLE</button>
            <div class="tablemenu" id="table-menu" hidden>
              <button data-tcmd="insert">Insert table</button>
              <button data-tcmd="addRow">Add row</button>
              <button data-tcmd="addCol">Add column</button>
              <button data-tcmd="delRow">Delete row</button>
              <button data-tcmd="delCol">Delete column</button>
              <button data-tcmd="borders">Toggle borders</button>
              <button data-tcmd="delTable">Delete table</button>
            </div>
          </div>
          <div class="group">
            <button id="btn-image">IMAGE</button>
          </div>
        </div>
      </header>

      <div class="editor-area">
        <div class="findbar" id="findbar" hidden>
          <span class="ico">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </span>
          <input id="find-input" type="text" placeholder="Find in document…" spellcheck="false" />
          <span class="count" id="find-count">&nbsp;</span>
          <button class="chip" id="find-case" title="Match case">Aa</button>
          <span class="div"></span>
          <button id="find-prev" title="Previous (Shift+Enter)">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
          </button>
          <button id="find-next" title="Next (Enter)">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <button id="find-close" title="Close (Esc)">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <main class="editor-scroll">
          <div class="editor-page" id="editor"></div>
        </main>
      </div>

      <div class="hint" id="hint">
        Open a <code>.latte</code> file to read or edit it. <strong>Save</strong> downloads an
        updated copy (browsers can't overwrite the original in place).
      </div>
    </div>

    <input id="file-input" type="file" accept=".latte,application/zip" hidden />
    <input id="image-input" type="file" accept="image/*" hidden />

    <script type="module" src="./main.js"></script>
  </body>
</html>
