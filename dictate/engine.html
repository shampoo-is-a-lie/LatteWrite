<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Latte Dictate</title>
<style>
  :root {
    --bg: #f6f4f1; --fg: #1c1a18; --dim: #6d6560; --line: #ded7d0;
    --accent: #7a4b28; --ok: #2f6b3a; --bad: #9a2b2b; --warn: #8a6a1f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171513; --fg: #ece7e1; --dim: #9c938c; --line: #35302b;
      --accent: #c98a55; --ok: #6fbf7f; --bad: #e07a7a; --warn: #d7b45c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px 14px; background: var(--bg); color: var(--fg);
    font: 13px/1.4 system-ui, sans-serif; overflow: hidden;
  }
  .row { display: flex; align-items: center; gap: 10px; }
  #dot { width: 11px; height: 11px; border-radius: 50%; background: var(--dim); flex: none; }
  #dot.on { background: var(--bad); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3 } }
  #state { font-weight: 700; letter-spacing: .13em; text-transform: uppercase; font-size: 12px; }
  #model { margin-left: auto; font-size: 10px; letter-spacing: .1em;
           text-transform: uppercase; color: var(--dim); }
  #heard {
    margin-top: 9px; height: 34px; overflow: hidden; color: var(--dim);
    font-size: 12px; line-height: 1.4;
  }
  #heard b { color: var(--fg); font-weight: 400; }
  button {
    font: 600 11px/1 system-ui, sans-serif; letter-spacing: .1em; text-transform: uppercase;
    padding: 9px 12px; border: 0; border-radius: 6px; background: var(--accent);
    color: #fff; cursor: pointer; margin-top: 8px; width: 100%;
  }
  button[hidden] { display: none; }
  .err { color: var(--bad); }
</style>
</head>
<body>

<div class="row">
  <div id="dot"></div>
  <div id="state">Connecting</div>
  <div id="model">-</div>
</div>
<div id="heard"></div>
<button id="install" hidden>Install offline model</button>

<script>
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const $ = id => document.getElementById(id);
let rec = null, want = false, availability = 'unknown';

function paint(label, on, cls) {
  $('state').textContent = label;
  $('state').className = cls || '';
  $('dot').className = on ? 'on' : '';
}

function post(kind, extra = {}) {
  return fetch('/event', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ kind, ...extra })
  }).then(r => r.json()).catch(() => null);
}

// The daemon's punctuator is stateful - spacing and capitalisation depend on
// the previous phrase - so finals must reach it in order. Serialise them.
let chain = Promise.resolve();
function sendFinal(text) {
  chain = chain.then(async () => {
    const r = await post('final', { text });
    if (r && r.out) {
      $('heard').innerHTML = '<b>' + r.out.replace(/[<&]/g, c =>
        c === '<' ? '&lt;' : '&amp;') + '</b>';
    }
  }).catch(() => {});
}

// ── availability ─────────────────────────────────────────────────────────────
async function refreshAvail() {
  if (!SR || typeof SR.available !== 'function') { availability = 'unsupported'; }
  else {
    try {
      availability = String(await SR.available({ langs: ['en-US'], processLocally: true }));
    } catch { availability = 'error'; }
  }
  $('model').textContent = availability;
  $('install').hidden = availability !== 'downloadable';
  return availability;
}

$('install').onclick = async () => {
  $('install').hidden = true;
  paint('Installing', false, '');
  const poll = setInterval(refreshAvail, 1500);
  try { await SR.install({ langs: ['en-US'], processLocally: true }); }
  catch (e) { post('status', { text: 'install failed: ' + e.message }); }
  finally {
    clearInterval(poll);
    await refreshAvail();
    post('ready', { availability });
    paint(want ? 'Listening' : 'Ready', want, '');
  }
};

// ── recognition ──────────────────────────────────────────────────────────────
function build() {
  const r = new SR();
  r.lang = 'en-US';
  r.continuous = true;
  r.interimResults = true;
  // Offline whenever the model is there; Chrome falls back to cloud if not.
  try { r.processLocally = (availability === 'available'); } catch {}

  r.onstart = () => paint('Listening', true, '');
  r.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      if (res.isFinal) {
        const t = res[0].transcript.trim();
        if (t) sendFinal(t);
      } else interim += res[0].transcript;
    }
    if (interim) $('heard').textContent = interim;
  };
  r.onerror = (e) => {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    post('status', { text: 'error: ' + e.error });
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      want = false;
      paint('Mic denied', false, 'err');
    }
  };
  // continuous still stops on its own, so restart to survive a long session.
  r.onend = () => {
    rec = null;
    if (want) setTimeout(() => { if (want) start(); }, 200);
    else paint('Ready', false, '');
  };
  return r;
}

function start() {
  if (rec) return;
  try { rec = build(); rec.start(); }
  catch (e) { post('status', { text: 'start failed: ' + e.message }); }
}

function stop() {
  const r = rec;
  rec = null;
  try { r && r.stop(); } catch {}
  paint('Ready', false, '');
}

// ── daemon channel ───────────────────────────────────────────────────────────
// EventSource reconnects on its own, so a dropped stream recovers silently.
function connect() {
  const es = new EventSource('/stream');
  es.onmessage = (e) => {
    let msg; try { msg = JSON.parse(e.data); } catch { return; }
    if (msg.cmd === 'start') { want = true; start(); }
    else if (msg.cmd === 'stop') { want = false; stop(); }
  };
  es.onerror = () => paint('Reconnecting', false, '');
}

(async () => {
  if (!SR) {
    paint('Needs Chrome', false, 'err');
    $('model').textContent = 'unsupported';
    return post('ready', { availability: 'unsupported' });
  }
  await refreshAvail();
  await post('ready', { availability });
  paint('Ready', false, '');
  connect();
})();
</script>
</body>
</html>
